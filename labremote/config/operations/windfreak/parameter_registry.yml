schema_version: 1
parameters:
- pattern: windfreak.client_operation_version
  kind: int
  choices:
  - 1
  readable: true
  writable: false
  verification: none
  max_age_s: 60.0
- pattern: windfreak.device_info_json
  kind: json_object
  required_values:
    family: windfreak_synthhd
  monitor: false
  readable: true
  writable: false
  verification: none
  max_age_s: 60.0
- pattern: windfreak.reference_requires_rf_off
  kind: bool
  readable: true
  writable: false
  verification: none
  max_age_s: 60.0
- pattern: windfreak.reference_mode
  kind: string
  choices:
  - external
  - internal 27mhz
  - internal 10mhz
  writable: true
  verification: readback
  readable: true
  max_age_s: 60.0
- pattern: windfreak.reference_frequency_hz
  kind: number
  minimum: 10000000.0
  maximum: 100000000.0
  writable: true
  verification: readback
  abs_tolerance: 1500
  rel_tolerance: 2.0e-09
  unit: Hz
  readable: true
  max_age_s: 60.0
- pattern: windfreak.channel_*.frequency_hz
  kind: number
  minimum: 53000000.0
  maximum: 13600000000.0
  writable: true
  verification: readback
  abs_tolerance: 1
  rel_tolerance: 2.0e-09
  unit: Hz
  readable: true
  max_age_s: 60.0
- pattern: windfreak.channel_*.power_dbm
  kind: number
  minimum: -60
  maximum: 20
  writable: true
  verification: readback
  abs_tolerance: 0.04
  rel_tolerance: 2.0e-09
  unit: dBm
  readable: true
  max_age_s: 60.0
- pattern: windfreak.channel_*.phase_deg
  kind: number
  writable: true
  unit: deg
  readable: true
  verification: none
  max_age_s: 60.0
- pattern: windfreak.channel_*.output_enabled
  kind: bool
  writable: true
  verification: readback
  readable: true
  max_age_s: 60.0
- pattern: windfreak.channel_*.pll_lock
  kind: bool
  nullable_readback: true
  readable: true
  writable: false
  verification: none
  max_age_s: 60.0
- pattern: windfreak.channel_*.rf_enabled
  kind: bool
  readable: true
  writable: false
  verification: none
  max_age_s: 60.0
- pattern: windfreak.channel_*.pa_enabled
  kind: bool
  readable: true
  writable: false
  verification: none
  max_age_s: 60.0
- pattern: windfreak.channel_*.pll_enabled
  kind: bool
  readable: true
  writable: false
  verification: none
  max_age_s: 60.0
- pattern: windfreak.temperature_c
  kind: number
  unit: C
  readable: true
  writable: false
  verification: none
  max_age_s: 60.0
