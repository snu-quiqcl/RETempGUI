schema_version: 1
parameters:
- pattern: anapico.identity
  kind: string
  writable: false
  verification: none
  monitor: false
- pattern: anapico.frequency
  kind: number
  writable: true
  verification: readback
  minimum: 10000000.0
  maximum: 20000000000.0
  abs_tolerance: 1
  rel_tolerance: 2.0e-09
- pattern: anapico.phase
  kind: number
  writable: true
  verification: readback
  minimum: -360
  maximum: 360
  abs_tolerance: 0.1
  period: 360
- pattern: anapico.output
  kind: bool
  writable: true
  verification: readback
- pattern: anapico.reference_source
  kind: string
  writable: true
  verification: readback
  choices:
  - INT
  - EXT
- pattern: anapico.external_lock_frequency
  kind: number
  writable: true
  verification: readback
  minimum: 1000000.0
  maximum: 250000000.0
  abs_tolerance: 1
  rel_tolerance: 1.0e-06
- pattern: anapico.locked
  kind: bool
  writable: false
  verification: none
- pattern: anapico.reference_output_enabled
  kind: bool
  writable: true
  verification: readback
- pattern: anapico.reference_output_frequency
  kind: number
  writable: true
  verification: readback
  choices:
  - 10000000.0
  - 100000000.0
  abs_tolerance: 1
