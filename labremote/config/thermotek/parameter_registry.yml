schema_version: 1
parameters:
- pattern: thermotek.client_operation_version
  kind: int
  writable: false
  verification: none
  choices:
  - 1
  monitor: false
- pattern: thermotek.watchdog_json
  kind: thermotek_watchdog
  writable: false
  verification: none
- pattern: thermotek.temperature_setpoint
  kind: number
  writable: true
  verification: readback
  minimum: 5
  maximum: 40
  abs_tolerance: 0.11
- pattern: thermotek.run_request
  kind: bool
  writable: true
  verification: readback
  readable: false
  readback_path: pump_running
  monitor: false
- pattern: thermotek.pump_running
  kind: bool
  writable: false
  verification: none
  monitor: false
- pattern: thermotek.supply_temperature
  kind: number
  writable: false
  verification: none
  readback_parser: number
- pattern: thermotek.ambient_temperature
  kind: number
  writable: false
  verification: none
  readback_parser: number
- pattern: thermotek.coolant_flow
  kind: number
  writable: false
  verification: none
  readback_parser: number
- pattern: thermotek.*_raw
  kind: json_object
  writable: false
  verification: none
  monitor: false
