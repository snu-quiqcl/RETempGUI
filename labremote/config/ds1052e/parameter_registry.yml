schema_version: 1
parameters:
- pattern: ds1052e.client_operation_version
  kind: int
  readback_parser: int
  writable: false
  verification: none
  choices:
  - 1
  monitor: false
- pattern: ds1052e.device_info_json
  kind: json_object
  writable: false
  verification: none
  required_values:
    family: rigol_ds1052e
  monitor: false
- pattern: ds1052e.time_scale
  kind: number
  readback_parser: number
  positive_readback: true
  writable: true
  verification: readback
  minimum: 1.0e-09
  maximum: 50
  abs_tolerance: 1.0e-12
  rel_tolerance: 0.01
- pattern: ds1052e.time_offset
  kind: number
  readback_parser: number
  writable: true
  verification: readback
  minimum: -500
  maximum: 500
  abs_tolerance: 1.0e-09
  rel_tolerance: 0.01
- pattern: ds1052e.trigger_status
  kind: string
  readback_parser: token
  writable: false
  verification: none
- pattern: ds1052e.trigger_mode
  kind: string
  readback_parser: token
  writable: true
  verification: readback
- pattern: ds1052e.trigger_source
  kind: string
  readback_aliases:
    CH1: CHAN1
    CH2: CHAN2
    CHAN1: CHAN1
    CHAN2: CHAN2
    CHANNEL1: CHAN1
    CHANNEL2: CHAN2
  writable: true
  verification: readback
  choices:
  - CHAN1
  - CHAN2
- pattern: ds1052e.trigger_slope
  kind: string
  readback_aliases:
    POSITIVE: POS
    NEGATIVE: NEG
    POS: POS
    NEG: NEG
  writable: true
  verification: readback
  choices:
  - POS
  - NEG
- pattern: ds1052e.trigger_sweep
  kind: string
  readback_aliases:
    AUTO: AUTO
    NORMAL: NORM
    NORM: NORM
    SINGLE: SING
    SING: SING
  writable: true
  verification: readback
  choices:
  - AUTO
  - NORM
  - SING
- pattern: ds1052e.trigger_level
  kind: number
  readback_parser: number
  writable: true
  verification: readback
  minimum: -10000.0
  maximum: 10000.0
  abs_tolerance: 0.001
  rel_tolerance: 0.01
- pattern: ds1052e.waveform_mode
  kind: string
  writable: true
  verification: none
  readable: false
  monitor: false
  choices:
  - NORM
- pattern: ds1052e.acquisition_running
  kind: bool
  writable: true
  verification: none
  readable: false
  monitor: false
  choices: []
- pattern: ds1052e.ch*_scale
  kind: number
  readback_parser: number
  positive_readback: true
  writable: true
  verification: readback
  minimum: 0.002
  maximum: 10000.0
  abs_tolerance: 1.0e-06
  rel_tolerance: 0.01
- pattern: ds1052e.ch*_offset
  kind: number
  readback_parser: number
  writable: true
  verification: readback
  minimum: -10000.0
  maximum: 10000.0
  abs_tolerance: 0.001
  rel_tolerance: 0.01
- pattern: ds1052e.ch*_display
  kind: string
  readback_aliases:
    1: 'ON'
    0: 'OFF'
    '1': 'ON'
    '0': 'OFF'
    'ON': 'ON'
    'OFF': 'OFF'
  writable: true
  verification: readback
  choices:
  - 'ON'
  - 'OFF'
- pattern: ds1052e.ch*_frequency
  kind: scope_measurement
  writable: false
  verification: none
  nullable_readback: true
- pattern: ds1052e.ch*_vpp
  kind: scope_measurement
  writable: false
  verification: none
  nullable_readback: true
- pattern: ds1052e.ch*_waveform
  kind: ds1052e_waveform
  writable: false
  verification: none
  monitor: false
