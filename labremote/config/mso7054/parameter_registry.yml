schema_version: 1
parameters:
- pattern: mso7054.client_operation_version
  kind: int
  writable: false
  verification: none
  choices:
  - 1
  monitor: false
- pattern: mso7054.device_info_json
  kind: json_object
  writable: false
  verification: none
  monitor: false
- pattern: mso7054.time_scale
  kind: number
  writable: true
  verification: readback
  minimum: 1.0e-10
  maximum: 100
  readback_parser: number
  abs_tolerance: 1.0e-09
  rel_tolerance: 0.01
  positive_readback: true
- pattern: mso7054.time_offset
  kind: number
  writable: true
  verification: readback
  minimum: -1000000.0
  maximum: 1000000.0
  readback_parser: number
  abs_tolerance: 1.0e-09
  rel_tolerance: 0.01
  positive_readback: false
- pattern: mso7054.ch*_scale
  kind: number
  writable: true
  verification: readback
  minimum: 1.0e-06
  maximum: 100
  readback_parser: number
  abs_tolerance: 0.001
  rel_tolerance: 0.01
  positive_readback: true
- pattern: mso7054.ch*_offset
  kind: number
  writable: true
  verification: readback
  minimum: -1000.0
  maximum: 1000.0
  readback_parser: number
  abs_tolerance: 0.001
  rel_tolerance: 0.01
  positive_readback: false
- pattern: mso7054.trigger_level
  kind: number
  writable: true
  verification: readback
  minimum: -1000.0
  maximum: 1000.0
  readback_parser: number
  abs_tolerance: 0.001
  rel_tolerance: 0.01
  positive_readback: false
- pattern: mso7054.trigger_type
  kind: string
  writable: true
  verification: readback
  choices:
  - EDGE
  readback_parser: token
  readback_aliases: {}
- pattern: mso7054.sweep
  kind: string
  writable: true
  verification: readback
  choices:
  - AUTO
  - NORM
  readback_parser: token
  readback_aliases:
    NORMAL: NORM
- pattern: mso7054.trigger_source
  kind: string
  writable: true
  verification: readback
  choices:
  - CHAN1
  - CHAN2
  - CHAN3
  - CHAN4
  readback_parser: token
  readback_aliases:
    CH1: CHAN1
    CH2: CHAN2
    CH3: CHAN3
    CH4: CHAN4
- pattern: mso7054.trigger_slope
  kind: string
  writable: true
  verification: readback
  choices:
  - POS
  - NEG
  - RFAL
  readback_parser: token
  readback_aliases:
    POSITIVE: POS
    NEGATIVE: NEG
    RFALL: RFAL
- pattern: mso7054.trigger_status
  kind: string
  writable: false
  verification: none
  readback_parser: token
- pattern: mso7054.ch*_display
  kind: bool
  writable: true
  verification: readback
  readback_aliases:
    'ON': true
    'OFF': false
    '1': true
    '0': false
- pattern: mso7054.ch*_vavg
  kind: scope_measurement
  writable: false
  verification: none
  nullable_readback: true
- pattern: mso7054.ch*_vrms
  kind: scope_measurement
  writable: false
  verification: none
  nullable_readback: true
- pattern: mso7054.ch*_vpp
  kind: scope_measurement
  writable: false
  verification: none
  nullable_readback: true
- pattern: mso7054.ch*_vmax
  kind: scope_measurement
  writable: false
  verification: none
  nullable_readback: true
- pattern: mso7054.ch*_vmin
  kind: scope_measurement
  writable: false
  verification: none
  nullable_readback: true
- pattern: mso7054.waveform_mode
  kind: string
  writable: true
  verification: none
  choices:
  - NORM
  readable: false
  monitor: false
- pattern: mso7054.waveform_format
  kind: string
  writable: true
  verification: none
  choices:
  - BYTE
  readable: false
  monitor: false
- pattern: mso7054.waveform_start
  kind: int
  writable: true
  verification: none
  choices:
  - 1
  readable: false
  monitor: false
- pattern: mso7054.waveform_stop
  kind: int
  writable: true
  verification: none
  choices:
  - 1000
  readable: false
  monitor: false
- pattern: mso7054.waveform_source
  kind: string
  writable: true
  verification: none
  choices:
  - CHAN1
  - CHAN2
  - CHAN3
  - CHAN4
  readable: false
  monitor: false
- pattern: mso7054.acquisition_command
  kind: string
  writable: true
  verification: none
  choices:
  - RUN
  - STOP
  - SING
  readable: false
  monitor: false
- pattern: mso7054.waveform_preamble
  kind: mso7054_preamble
  writable: false
  verification: none
  monitor: false
- pattern: mso7054.waveform_data
  kind: mso7054_waveform
  writable: false
  verification: none
  monitor: false
