# Merge entries into the existing instruments mapping.
# initialize: true constructs the QCoDeS object; USB and outputs stay unchanged.
instruments:
  dac_ea:
    type: trap_dac.qcodes_driver.DAC81416
    initialize: true
    init:
      serial_port: /dev/serial/by-id/REPLACE_EA_DAC_USB
      internal_reference: false
    gui:
      type: generic
      kwargs:
        parameters-hide: [IDN]
  dac_ec:
    type: trap_dac.qcodes_driver.DAC81416
    initialize: true
    init:
      serial_port: /dev/serial/by-id/REPLACE_EC_DAC_USB
      internal_reference: false
    gui:
      type: generic
      kwargs:
        parameters-hide: [IDN]
