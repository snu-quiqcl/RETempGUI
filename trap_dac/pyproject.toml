[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retemp-trap-dac"
version = "1.0.0"
description = "Server-owned DAC81416 chip-trap control for RETempGUI"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5,<4"]

[tool.setuptools]
packages = ["trap_dac", "trap_dac.vendor"]
package-dir = {"trap_dac" = "."}

[tool.setuptools.package-data]
trap_dac = ["configs/*.example.json"]
